<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">LensLab Data Science Workbench</title>
  <desc id="desc">A three-column data analysis interface with dataset fields, charts, model metrics, and a local insights panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.muted{fill:#64748b}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:13px;font-weight:600}.heading{font-size:18px;font-weight:700}.metric{font-size:24px;font-weight:700}.line{stroke:#e2e8f0}.card{fill:#fff;stroke:#dfe5ec}.pill{fill:#eff6ff;stroke:#bfdbfe}
    </style>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="45" y="34" width="1350" height="792" rx="20" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="45" y="34" width="1350" height="58" rx="20" fill="#fff"/>
  <path d="M45 72h1350v20H45z" fill="#fff"/>
  <line x1="45" y1="92" x2="1395" y2="92" class="line"/>
  <rect x="67" y="49" width="30" height="30" rx="8" fill="url(#blue)"/>
  <path d="M75 69l6-10 5 7 4-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="109" y="69" class="t heading">LensLab</text>
  <text x="188" y="69" class="muted small">Data Science Workbench</text>
  <rect x="1181" y="49" width="93" height="30" rx="7" fill="#f8fafc" stroke="#dfe5ec"/>
  <text x="1199" y="69" class="t tiny">导出报告</text>
  <rect x="1284" y="49" width="87" height="30" rx="7" fill="#2563eb"/>
  <text x="1303" y="69" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#fff">运行分析</text>

  <rect x="45" y="92" width="240" height="734" fill="#fbfcfe"/>
  <line x1="285" y1="92" x2="285" y2="826" class="line"/>
  <text x="67" y="126" class="t label">数据集</text>
  <rect x="65" y="143" width="198" height="64" rx="9" class="card"/>
  <rect x="79" y="158" width="32" height="32" rx="7" fill="#eff6ff"/>
  <path d="M88 166h14M88 172h14M88 178h9" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="122" y="169" class="t label">SaaS 经营指标</text>
  <text x="122" y="188" class="muted tiny">120 行 · 8 字段</text>
  <text x="67" y="239" class="t label">字段</text>
  <g class="small">
    <rect x="65" y="253" width="198" height="42" rx="7" fill="#eff6ff"/><text x="79" y="279" class="t">month</text><text x="224" y="279" class="muted tiny">日期</text>
    <text x="79" y="321" class="t">revenue</text><text x="224" y="321" class="muted tiny">数值</text>
    <text x="79" y="363" class="t">region</text><text x="224" y="363" class="muted tiny">类别</text>
    <text x="79" y="405" class="t">channel</text><text x="224" y="405" class="muted tiny">类别</text>
    <text x="79" y="447" class="t">churn_rate</text><text x="224" y="447" class="muted tiny">数值</text>
    <text x="79" y="489" class="t">active_users</text><text x="224" y="489" class="muted tiny">数值</text>
  </g>
  <line x1="65" y1="514" x2="263" y2="514" class="line"/>
  <text x="67" y="545" class="t label">数据质量</text>
  <rect x="65" y="560" width="198" height="87" rx="9" class="card"/>
  <text x="80" y="584" class="muted tiny">质量分数</text><text x="80" y="616" class="t metric">94</text>
  <rect x="128" y="599" width="116" height="8" rx="4" fill="#e2e8f0"/><rect x="128" y="599" width="107" height="8" rx="4" fill="#22c55e"/>
  <text x="80" y="636" class="muted tiny">3 缺失 · 0 重复</text>

  <rect x="285" y="92" width="820" height="734" fill="#f5f7fa"/>
  <text x="313" y="129" class="t heading">SaaS 经营指标分析</text>
  <text x="313" y="151" class="muted tiny">交互探索 · 清洗 · Python 建模</text>
  <g>
    <rect x="787" y="113" width="92" height="51" rx="8" class="card"/><text x="800" y="133" class="muted tiny">记录</text><text x="800" y="153" class="t label">120</text>
    <rect x="887" y="113" width="92" height="51" rx="8" class="card"/><text x="900" y="133" class="muted tiny">字段</text><text x="900" y="153" class="t label">8</text>
    <rect x="987" y="113" width="92" height="51" rx="8" class="card"/><text x="1000" y="133" class="muted tiny">缺失率</text><text x="1000" y="153" class="t label">0.3%</text>
  </g>
  <text x="313" y="196" class="t label">概览</text><text x="377" y="196" class="muted label">数据清洗</text><text x="466" y="196" class="muted label">Python 建模</text><text x="570" y="196" class="muted label">实验记录</text>
  <line x1="313" y1="209" x2="1079" y2="209" class="line"/><rect x="313" y="207" width="34" height="2" fill="#2563eb"/>

  <rect x="313" y="230" width="484" height="310" rx="11" class="card"/>
  <text x="334" y="261" class="t label">月度收入趋势</text><text x="334" y="281" class="muted tiny">按 month 汇总 revenue</text>
  <line x1="353" y1="486" x2="764" y2="486" class="line"/><line x1="353" y1="322" x2="353" y2="486" class="line"/>
  <line x1="353" y1="431" x2="764" y2="431" stroke="#edf2f7"/><line x1="353" y1="376" x2="764" y2="376" stroke="#edf2f7"/>
  <polyline points="365,455 417,438 469,444 521,404 573,392 625,355 677,366 729,323 755,306" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb"><circle cx="365" cy="455" r="4"/><circle cx="417" cy="438" r="4"/><circle cx="469" cy="444" r="4"/><circle cx="521" cy="404" r="4"/><circle cx="573" cy="392" r="4"/><circle cx="625" cy="355" r="4"/><circle cx="677" cy="366" r="4"/><circle cx="729" cy="323" r="4"/><circle cx="755" cy="306" r="4"/></g>
  <text x="353" y="510" class="muted tiny">01</text><text x="550" y="510" class="muted tiny">05</text><text x="743" y="510" class="muted tiny">09</text>

  <rect x="815" y="230" width="264" height="310" rx="11" class="card"/>
  <text x="835" y="261" class="t label">数据健康度</text>
  <circle cx="947" cy="350" r="63" fill="none" stroke="#e2e8f0" stroke-width="15"/>
  <circle cx="947" cy="350" r="63" fill="none" stroke="#22c55e" stroke-width="15" stroke-linecap="round" stroke-dasharray="372 396" transform="rotate(-90 947 350)"/>
  <text x="927" y="359" class="t metric">94</text>
  <text x="922" y="381" class="muted tiny">/ 100</text>
  <rect x="836" y="449" width="221" height="1" fill="#e2e8f0"/>
  <text x="836" y="477" class="muted tiny">数值字段</text><text x="1037" y="477" class="t label">4</text>
  <text x="836" y="504" class="muted tiny">可建模记录</text><text x="1018" y="504" class="t label">120</text>

  <rect x="313" y="560" width="766" height="224" rx="11" class="card"/>
  <text x="334" y="592" class="t label">Python 训练与评估</text>
  <rect x="473" y="574" width="101" height="26" rx="13" class="pill"/><text x="490" y="592" fill="#2563eb" font-family="Inter,Segoe UI,Arial" font-size="11">Pyodide Worker</text>
  <rect x="928" y="574" width="130" height="30" rx="7" fill="#2563eb"/><text x="951" y="594" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="12">开始真实训练</text>
  <g>
    <rect x="334" y="622" width="166" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="348" y="646" class="muted tiny">最佳模型</text><text x="348" y="676" class="t label">梯度提升回归</text>
    <rect x="513" y="622" width="166" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="527" y="646" class="muted tiny">MAE</text><text x="527" y="678" class="t metric">2.184</text>
    <rect x="692" y="622" width="166" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="706" y="646" class="muted tiny">训练 / 测试</text><text x="706" y="678" class="t metric">96 / 24</text>
    <rect x="871" y="622" width="187" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="885" y="646" class="muted tiny">展开后特征</text><text x="885" y="678" class="t metric">17</text>
  </g>
  <rect x="334" y="720" width="216" height="28" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/><text x="347" y="739" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="11">固定随机种子独立测试集 80/20</text>

  <rect x="1105" y="92" width="290" height="734" fill="#fff"/>
  <line x1="1105" y1="92" x2="1105" y2="826" class="line"/>
  <text x="1128" y="128" class="t heading">本地分析助手</text>
  <text x="1128" y="150" class="muted tiny">基于统计摘要生成建议</text>
  <rect x="1128" y="179" width="244" height="156" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1146" y="207" class="t label">经营趋势摘要</text>
  <text x="1146" y="234" class="muted tiny">收入整体上升，最近一期较首期</text>
  <text x="1146" y="253" class="muted tiny">增长 21.8%。流失率与收入呈现</text>
  <text x="1146" y="272" class="muted tiny">中等负相关，建议按区域复核。</text>
  <circle cx="1150" cy="302" r="4" fill="#2563eb"/><text x="1162" y="306" class="muted tiny">观察：增长趋势稳定</text>
  <rect x="1128" y="357" width="244" height="38" rx="19" fill="#fff" stroke="#dbe3ec"/><text x="1147" y="381" class="muted tiny">分析缺失值和异常点</text>
  <rect x="1128" y="406" width="244" height="38" rx="19" fill="#fff" stroke="#dbe3ec"/><text x="1147" y="430" class="muted tiny">找出最强相关字段</text>
  <rect x="1128" y="455" width="244" height="38" rx="19" fill="#fff" stroke="#dbe3ec"/><text x="1147" y="479" class="muted tiny">给出建模验证方案</text>
  <text x="1128" y="541" class="t label">方法与置信度</text>
  <rect x="1128" y="557" width="244" height="96" rx="9" class="card"/>
  <text x="1145" y="584" class="muted tiny">方法</text><text x="1193" y="584" class="t tiny">描述统计 + 相关分析</text>
  <text x="1145" y="610" class="muted tiny">范围</text><text x="1193" y="610" class="t tiny">120 行 / 8 字段</text>
  <text x="1145" y="636" class="muted tiny">状态</text><text x="1193" y="636" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12">本地计算完成</text>
  <rect x="1128" y="681" width="244" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1145" y="709" fill="#1d4ed8" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="600">隐私优先</text>
  <text x="1145" y="735" class="muted tiny">数据读取、清洗与模型训练均在</text>
  <text x="1145" y="753" class="muted tiny">浏览器中完成。</text>
</svg>
